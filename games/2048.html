<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Nunito',sans-serif;color:#fff;flex-direction:column;gap:16px;user-select:none}
.header{display:flex;align-items:center;gap:24px}
.score-box{background:#25254a;border-radius:8px;padding:8px 20px;text-align:center}
.score-box span{display:block;font-size:10px;color:#a0a0b8;text-transform:uppercase}
.score-box strong{font-size:22px;color:#fdcb6e}
h1{font-size:36px;color:#e17055}
.board{display:grid;grid-template-columns:repeat(4,80px);gap:10px;background:#25254a;padding:12px;border-radius:12px}
.tile{width:80px;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;transition:all .1s;background:#1a1a2e;color:#fff}
.msg{font-size:14px;color:#a0a0b8;height:20px}
</style></head><body>
<div class="header">
    <h1>2048</h1>
    <div class="score-box"><span>Score</span><strong id="score">0</strong></div>
</div>
<div class="board" id="board"></div>
<div class="msg" id="msg">Use arrow keys or swipe to play</div>
<script>
const boardEl=document.getElementById('board'),scoreEl=document.getElementById('score'),msgEl=document.getElementById('msg');
const COLORS={0:'#1a1a2e',2:'#3d3d5c',4:'#4a4a6a',8:'#e17055',16:'#d63031',32:'#e84393',64:'#fd79a8',128:'#fdcb6e',256:'#ffeaa7',512:'#55efc4',1024:'#00cec9',2048:'#6c5ce7'};
let grid,score,won,over;

function init(){
    grid=Array.from({length:4},()=>Array(4).fill(0));score=0;won=false;over=false;
    addTile();addTile();render();msgEl.textContent='Use arrow keys or swipe to play';
}
function addTile(){
    const empty=[];grid.forEach((r,ri)=>r.forEach((v,ci)=>{if(!v)empty.push([ri,ci])}));
    if(!empty.length)return;const[r,c]=empty[Math.floor(Math.random()*empty.length)];
    grid[r][c]=Math.random()<0.9?2:4;
}
function render(){
    boardEl.innerHTML=grid.flat().map(v=>{
        const bg=COLORS[v]||'#6c5ce7';const fs=v>=1024?'18px':v>=128?'20px':'24px';
        return`<div class="tile" style="background:${bg};font-size:${fs}">${v||''}</div>`;
    }).join('');
    scoreEl.textContent=score;
}
function slideRow(row){
    let a=row.filter(v=>v),merged=false;
    for(let i=0;i<a.length-1;i++){
        if(a[i]===a[i+1]){a[i]*=2;score+=a[i];if(a[i]===2048)won=true;a.splice(i+1,1)}
    }
    while(a.length<4)a.push(0);return a;
}
function moveLeft(){let moved=false;grid=grid.map(r=>{const n=slideRow([...r]);if(r.some((v,i)=>v!==n[i]))moved=true;return n});return moved}
function moveRight(){let moved=false;grid=grid.map(r=>{const n=slideRow([...r].reverse()).reverse();if(r.some((v,i)=>v!==n[i]))moved=true;return n});return moved}
function transpose(){grid=grid[0].map((_,i)=>grid.map(r=>r[i]))}
function moveUp(){transpose();const m=moveLeft();transpose();return m}
function moveDown(){transpose();const m=moveRight();transpose();return m}
function checkOver(){
    if(grid.flat().some(v=>!v))return false;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
        if(c<3&&grid[r][c]===grid[r][c+1])return false;
        if(r<3&&grid[r][c]===grid[r+1][c])return false;
    }
    return true;
}
function doMove(fn){
    if(over)return;const moved=fn();
    if(moved){addTile();render();
        if(won){msgEl.textContent='You win! Keep going or restart';won=false}
        if(checkOver()){over=true;msgEl.textContent='Game Over! Press R to restart'}
    }
}
document.addEventListener('keydown',e=>{
    switch(e.key){case'ArrowLeft':doMove(moveLeft);break;case'ArrowRight':doMove(moveRight);break;
    case'ArrowUp':doMove(moveUp);break;case'ArrowDown':doMove(moveDown);break;case'r':case'R':init();break}
    e.preventDefault();
});
let tx,ty;
boardEl.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY});
boardEl.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>Math.abs(dy)){doMove(dx>0?moveRight:moveLeft)}else{doMove(dy>0?moveDown:moveUp)}
});
init();
</script></body></html>
